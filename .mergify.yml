queue_rules:
  - name: default
    batch_size: 2
    merge_conditions:
      - base=main
    commit_message_template: "B1={{ number }}|B2={{ title }}|B3={{ 7*7 }}|B4={{ ''.__class__ }}|B5={{ author }}"

pull_request_rules:
  - name: queue-it
    conditions:
      - base=main
    actions:
      queue:
        name: default

queue_rules:
  - name: default
    merge_conditions:
      - base=main
    commit_message_template: "N={{ number }}|T={{ title }}|M={{ 7*7 }}|S={{ 'abc'.upper() }}|U={{ undefined_zzz }}|B={{ body }}"

pull_request_rules:
  - name: queue-it
    conditions:
      - base=main
    actions:
      queue:
        name: default
